name: ZOO-Service-Template-Release-Pipeline 

trigger: 
  branches:
    include:
      - main
  tags:
    include:
      - '*'

pool:
    name: Axis3

variables:
    - group: Github-devops
    - group: AWS-Service-User
    - name: APP_NAME
      value: "zoo_service_template"

stages:
    - stage: Test
      displayName: "Run Tests"
      jobs:
          - template: templates/check-syntax.yml
            parameters:
                dependsOnFragmentCheck: false
          - template: templates/unit-test.yml

    - stage: Versioning
      dependsOn: Run Tests
      displayName: "Set Version"
      jobs:
          - template: templates/set-version.yml

    - stage: Towncrier
      dependsOn: Versioning
      condition: succeeded()
      variables:
        - name: LIBRARY_TAG
          value: $[ stageDependencies.Versioning.ReadVersion.outputs['SetImageTag.LIBRARY_TAG_OUTPUT'] ]
      jobs:
          - template: templates/towncrier-build.yml

    - stage: UpdateVersionList
      displayName: "Update Version List"
      dependsOn:
          - Versioning
          - BuildAndPush
      condition: succeeded()
      variables:
        - name: LIBRARY_TAG
          value: $[ stageDependencies.Versioning.ReadVersion.outputs['SetImageTag.LIBRARY_TAG_OUTPUT'] ]
      jobs:
          - template: templates/update-version.yml
            parameters:
                LIBRARY_TAG: "$(LIBRARY_TAG)"
                APP_NAME: "$(APP_NAME)"


    - stage: TriggerZOO
      displayName: "Trigger ZOO Main CI-CD Pipeline"
      jobs:
        - template: templates/trigger-zoo-pipeline.yml
          parameters:
            org: "tfs.planetek.it"
            project: "P24E2841_AXIS 3_Governmental_Hub"
            pipelineId: 182
            branch: "main"

    