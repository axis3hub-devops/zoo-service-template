parameters:
  - name: org
    type: string
  - name: project
    type: string
  - name: pipelineId
    type: number
  - name: branch
    type: string
    default: develop

jobs:
  - job: TriggerZoo
    displayName: "Trigger ZOO CI-CD Pipeline"
    steps:
      - script: |
          echo "Triggering ZOO CI-CD pipeline..."

          ORG="${{ parameters.org }}"
          PROJECT="${{ parameters.project }}"
          PIPELINE_ID="${{ parameters.pipelineId }}"
          BRANCH="${{ parameters.branch }}"

          TOKEN="$(System.AccessToken)"
          AUTH=$(echo -n ":$TOKEN" | base64)

          # Encode project name (spaces → %20)
          ENCODED_PROJECT=$(echo -n "$PROJECT" | sed 's/ /%20/g')

          # Encode collection (hardcoded from your URL)
          COLLECTION="Planetek%20Hellas"

          echo "ORG: $ORG"
          echo "PROJECT: $PROJECT"
          echo "PIPELINE_ID: $PIPELINE_ID"
          echo "BRANCH: $BRANCH"

          echo "Testing DNS resolution..."
          nslookup $ORG || true

          echo "Testing connectivity..."
          curl -v https://$ORG || true

          echo "Calling TFS Build API..."

          RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -d '{
                  "definition": { "id": '"$PIPELINE_ID"' }
                }' \
            "https://$ORG/$COLLECTION/$ENCODED_PROJECT/_apis/build/builds?api-version=6.0")

          echo "Response:"
          echo "$RESPONSE"

          echo "Trigger step completed."
        displayName: "Trigger ZOO pipeline"
        env:
          System.AccessToken: $(System.AccessToken)