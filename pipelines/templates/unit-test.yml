jobs:
    - job: UnitTests
      displayName: "Tests and Sonar Analysis"
      dependsOn: CheckSyntax
      condition: succeeded()

      steps:
          - script: |
                wget -qO- https://astral.sh/uv/install.sh | sh
            displayName: "Install UV"

          - script: |
                source $HOME/.local/bin/env
                uv sync
                source .venv/bin/activate
                mkdir -p report
                uv run pytest -m "not e2e" --cov=. --cov-report=xml --cov-report=html --junitxml=report/test-results.xml
            displayName: "Run tests"

          # === Branch-based coverage fix logic ===
          - task: Bash@3
            displayName: "Normalize coverage paths"
            inputs:
                targetType: "inline"
                script: |
                    coverageFile="$(System.DefaultWorkingDirectory)/coverage.xml"

                    echo "=== Starting coverage normalization for $(Build.SourceBranchName) ==="

                    if [ ! -f "$coverageFile" ]; then
                      echo "Coverage file not found!"
                      exit 1
                    fi

                    if [ "$(Build.SourceBranchName)" = "main" ]; then
                      echo "Main branch detected — applying QA-style normalization"
                      sed -i 's|<source>/azp/_work/30/s/</source>|<source>/azp/_work/30/s</source>|g' "$coverageFile"
                      sed -i 's|filename="|filename="/|g' "$coverageFile"
                    else
                      echo "Feature branch detected — applying generic normalization"
                      sed -i "s|$(System.DefaultWorkingDirectory)|.|g" "$coverageFile"
                    fi

                    echo "=== Coverage normalization complete ==="

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
                testResultsFormat: "JUnit"
                testResultsFiles: "$(System.DefaultWorkingDirectory)/report/test-results.xml"
                failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@1
            displayName: "Publish Code Coverage"
            inputs:
                codeCoverageTool: "Cobertura"
                summaryFileLocation: "$(System.DefaultWorkingDirectory)/coverage.xml"
                pathToSources: "$(System.DefaultWorkingDirectory)"

          - task: SonarQubePrepare@7
            displayName: "SonarQube Prepare"
            inputs:
                SonarQube: "sonarqube-pk-hellas"
                scannerMode: "cli"
                configMode: "manual"
                cliProjectKey: "P24E2841_AXIS_3_Governmental_Hub_zoo_service_template_7a689edd-c37b-4ede-800a-b01e42df6c92"
                cliSources: "."
                extraProperties: |
                    sonar.sources=.
                    sonar.coverage.exclusions=tests/**
                    sonar.exclusions={{cookiecutter.service_name}}/service.py
                    sonar.python.coverage.reportPaths=$(System.DefaultWorkingDirectory)/coverage.xml
                    sonar.python.version=3.12

          - task: SonarQubeAnalyze@7
            displayName: "SonarQube Analyze"
            inputs:
                jdkversion: "JAVA_HOME_17_X64"

          - task: SonarQubePublish@7
            displayName: "SonarQube Publish"
            inputs:
                pollingTimeoutSec: "300"
            continueOnError: true

    - job: RenderedProjectQuality
      displayName: "Rendered Project Tests"
      dependsOn: UnitTests
      condition: succeeded()

      steps:
          - script: |
                wget -qO- https://astral.sh/uv/install.sh | sh
            displayName: "Install UV"

          - script: |
                source $HOME/.local/bin/env
                uv sync
            displayName: "Sync dependencies"

          - script: |
                source $HOME/.local/bin/env
                uv run python - <<'PY'
                import os
                import shutil
                from pathlib import Path

                from cookiecutter.main import cookiecutter

                workspace = Path(os.environ["SYSTEM_DEFAULTWORKINGDIRECTORY"])
                output_root = workspace / ".sonar-rendered"
                if output_root.exists():
                    shutil.rmtree(output_root)
                output_root.mkdir(parents=True, exist_ok=True)

                config_path = output_root / "cookiecutter-sonar-config.yaml"
                config_path.write_text(
                    f"cookiecutters_dir: '{output_root / '.cookiecutters'}'\n"
                    f"replay_dir: '{output_root / '.cookiecutter_replay'}'\n"
                    "default_context: {}\n"
                    "abbreviations:\n"
                    "  gh: https://github.com/{0}.git\n"
                    "  gl: https://gitlab.com/{0}.git\n"
                    "  bb: https://bitbucket.org/{0}.git\n"
                )

                rendered_project = Path(
                    cookiecutter(
                        str(workspace),
                        no_input=True,
                        output_dir=str(output_root),
                        config_file=str(config_path),
                        overwrite_if_exists=True,
                        extra_context={
                            "service_name": "sonar_rendered_service",
                            "workflow_id": "sonar-rendered-workflow",
                        },
                    )
                ).resolve()

                print(f"Rendered project for Sonar: {rendered_project}")
                print(f"##vso[task.setvariable variable=SONAR_RENDERED_DIR]{rendered_project}")
                PY
            displayName: "Render Cookiecutter Project For Sonar"

          - script: |
                source $HOME/.local/bin/env
                mkdir -p report
                uv run pytest tests/test_upload_logs_to_s3.py \
                  --junitxml=report/rendered-test-results.xml
            displayName: "Run tests against rendered project"
            env:
                RENDERED_SERVICE_DIR: $(SONAR_RENDERED_DIR)

          - task: PublishTestResults@2
            displayName: "Publish Rendered Test Results"
            inputs:
                testResultsFormat: "JUnit"
                testResultsFiles: "$(System.DefaultWorkingDirectory)/report/rendered-test-results.xml"
                failTaskOnFailedTests: true
