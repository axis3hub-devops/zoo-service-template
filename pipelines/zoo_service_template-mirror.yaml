trigger:
  branches:
    include:
      - develop
      - main
  tags:
    include:
      - '*'

pool:
  name: Axis3

variables:
- group: Github-devops

stages:
  - stage: PushToGitHub
    displayName: Mirror Azure DevOps → GitHub
    jobs:
      - job: SyncPush
        displayName: Sync & Push Repository
        steps:

          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - script: |
              set -e

              echo "Configuring Git user..."
              git config user.name "mieron"
              git config user.email "ieronymaki@planetek.gr"

              echo "Disabling interactive git prompts..."
              git config --global credential.helper ""
              git config --global core.askPass ""

              echo "Setting GitHub remote..."
              git remote remove github 2>/dev/null || true
              git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/HellenicSpaceCenter/axis3-hub-zoo-service-template

              SOURCE_REF="${BUILD_SOURCEBRANCH}"

              echo "Detected ref: $SOURCE_REF"

              ########################################
              # Branch mirroring
              ########################################
              if [[ "$SOURCE_REF" == refs/heads/* ]]; then

                BRANCH="${SOURCE_REF#refs/heads/}"
                echo "Processing branch: $BRANCH"

                git fetch origin
                git checkout "$BRANCH"

                echo "Pulling latest Azure DevOps changes..."
                git pull origin "$BRANCH" --ff-only || true

                echo "Checking GitHub branch existence..."
                if git ls-remote --heads github "$BRANCH" | grep -q "$BRANCH"; then
                  git pull github "$BRANCH" --ff-only || true
                fi

                echo "Pushing branch to GitHub..."
                git push github "$BRANCH"

              ########################################
              # Tag mirroring
              ########################################
              elif [[ "$SOURCE_REF" == refs/tags/* ]]; then

                TAG="${SOURCE_REF#refs/tags/}"
                echo "Processing tag: $TAG"

                git fetch origin --tags

                echo "Pushing tag to GitHub..."
                git push github "refs/tags/$TAG"

              else
                echo "Unknown ref type. Skipping mirroring."
              fi

              echo "Mirror complete."

            displayName: Mirror Repository
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)